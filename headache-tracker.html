<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>頭痛ログ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --bg2: #17171a;
    --bg3: #1e1e23;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8e6e0;
    --text2: #8a8880;
    --text3: #5a5856;
    --accent: #c8a97e;
    --accent2: #e8c99e;
    --red: #e05a5a;
    --red-dim: rgba(224,90,90,0.15);
    --green: #5ab87a;
    --blue: #5a9be0;
    --blue-dim: rgba(90,155,224,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Layout */
  .app { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* Header */
  .header { margin-bottom: 2.5rem; border-bottom: 0.5px solid var(--border); padding-bottom: 1.5rem; }
  .header-top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .logo { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .title { font-size: 22px; font-weight: 500; color: var(--text); }
  .weather-widget { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 12px; padding: 0.75rem 1.25rem; display: flex; align-items: center; gap: 12px; min-width: 200px; }
  .weather-icon { font-size: 24px; }
  .weather-info { }
  .weather-temp { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--text); }
  .weather-detail { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .weather-loading { font-size: 12px; color: var(--text3); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 2rem; background: var(--bg2); border-radius: 10px; padding: 4px; border: 0.5px solid var(--border); }
  .tab { flex: 1; padding: 0.5rem; text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text2); transition: all 0.18s; border: none; background: none; font-family: inherit; }
  .tab.active { background: var(--bg3); color: var(--text); border: 0.5px solid var(--border2); }
  .tab:hover:not(.active) { color: var(--text); }

  /* Panel */
  .panel { display: none; }
  .panel.active { display: block; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  input, select, textarea {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    padding: 0.6rem 0.85rem;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--bg3); }
  textarea { resize: vertical; min-height: 72px; }

  /* Slider */
  .slider-wrap { position: relative; }
  .slider-value { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--accent); margin-bottom: 6px; }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--val, 0%), var(--bg3) var(--val, 0%), var(--bg3) 100%);
    border-radius: 2px;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--bg);
    cursor: pointer;
  }

  /* Checkboxes / toggle pills */
  .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-block; }
  .pill input { display: none; }
  .pill label {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }
  .pill input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 500; }

  /* Headache toggle */
  .headache-toggle { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: 12px; padding: 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; grid-column: 1 / -1; }
  .headache-toggle-label { }
  .headache-toggle-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .headache-toggle-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .toggle-btn { display: flex; gap: 4px; }
  .toggle-btn button {
    padding: 6px 16px; border-radius: 8px; border: 0.5px solid var(--border2);
    background: none; color: var(--text2); cursor: pointer; font-family: inherit; font-size: 13px;
    transition: all 0.15s;
  }
  .toggle-btn button.active-yes { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .toggle-btn button.active-no { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }

  /* Section divider */
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); font-weight: 500; padding: 1.5rem 0 0.75rem; border-top: 0.5px solid var(--border); margin-top: 1rem; grid-column: 1/-1; }
  .section-label:first-child { border-top: none; padding-top: 0; margin-top: 0; }

  /* Submit */
  .submit-row { grid-column: 1/-1; display: flex; justify-content: flex-end; padding-top: 0.5rem; }
  .btn-submit {
    background: var(--accent); color: var(--bg); border: none;
    border-radius: 10px; padding: 0.7rem 2rem; font-family: inherit;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .btn-submit:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }

  /* Toast */
  .toast {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg3); border: 0.5px solid var(--border2); border-radius: 10px;
    padding: 0.75rem 1.5rem; font-size: 13px; color: var(--text);
    opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Log list */
  .log-filters { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .filter-btn { padding: 4px 14px; border-radius: 20px; border: 0.5px solid var(--border2); background: none; color: var(--text2); cursor: pointer; font-family: inherit; font-size: 12px; transition: all 0.15s; }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(200,169,126,0.08); }

  .log-empty { text-align: center; padding: 4rem 2rem; color: var(--text3); font-size: 13px; }

  .log-item {
    background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.75rem;
    display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: start;
    transition: border-color 0.15s;
  }
  .log-item:hover { border-color: var(--border2); }
  .log-item.has-headache { border-left: 2px solid var(--red); }
  .log-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); white-space: nowrap; padding-top: 2px; }
  .log-body { }
  .log-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .log-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg3); color: var(--text2); }
  .log-tag.red { background: var(--red-dim); color: var(--red); }
  .log-tag.accent { background: rgba(200,169,126,0.12); color: var(--accent); }
  .log-headache-badge { font-size: 11px; color: var(--red); font-weight: 500; white-space: nowrap; }
  .log-meta { font-size: 12px; color: var(--text2); }
  .log-note { font-size: 12px; color: var(--text2); margin-top: 4px; font-style: italic; }
  .log-delete { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; transition: color 0.15s; }
  .log-delete:hover { color: var(--red); }

  /* Charts panel */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  .chart-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .chart-card.full { grid-column: 1/-1; }
  .chart-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 1rem; font-weight: 500; }
  .chart-wrap { position: relative; height: 180px; }
  .chart-wrap.tall { height: 240px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .stat-card { background: var(--bg3); border-radius: 8px; padding: 0.85rem; text-align: center; }
  .stat-num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .chart-empty { text-align: center; padding: 2rem; color: var(--text3); font-size: 12px; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .chart-grid { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2,1fr); }
    .header-top { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="logo">Headache Tracker</div>
        <div class="title">頭痛ログ</div>
      </div>
      <div class="weather-widget" id="weatherWidget">
        <div class="weather-loading">📍 位置情報を取得中...</div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('record')">記録する</button>
    <button class="tab" onclick="switchTab('log')">ログ一覧</button>
    <button class="tab" onclick="switchTab('chart')">分析</button>
  </div>

  <!-- Record Panel -->
  <div class="panel active" id="panel-record">
    <form class="form-grid" onsubmit="saveRecord(event)">

      <div class="section-label" style="border-top:none;padding-top:0">基本情報</div>

      <div class="form-group">
        <label>日付</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="form-group">
        <label>時刻</label>
        <input type="time" id="f-time">
      </div>

      <!-- Headache toggle -->
      <div class="headache-toggle">
        <div class="headache-toggle-label">
          <div class="headache-toggle-title">今日、頭痛はありましたか？</div>
          <div class="headache-toggle-sub" id="headache-sub">未選択</div>
        </div>
        <div class="toggle-btn">
          <button type="button" id="btn-yes" onclick="setHeadache(true)">あった</button>
          <button type="button" id="btn-no" onclick="setHeadache(false)">なかった</button>
        </div>
      </div>

      <!-- Headache details (shown when yes) -->
      <div class="form-group" id="intensity-group" style="display:none">
        <label>頭痛の強さ</label>
        <div class="slider-value" id="intensity-val">5</div>
        <input type="range" min="1" max="10" value="5" id="f-intensity"
          oninput="updateSlider(this,'intensity-val')" style="--val:40%">
      </div>
      <div class="form-group" id="type-group" style="display:none">
        <label>頭痛の種類</label>
        <select id="f-headache-type">
          <option value="">選択...</option>
          <option>片頭痛（ズキズキ）</option>
          <option>緊張型（締め付け）</option>
          <option>群発頭痛</option>
          <option>わからない</option>
        </select>
      </div>

      <div class="section-label">生活習慣</div>

      <div class="form-group">
        <label>睡眠時間（時間）</label>
        <div class="slider-value" id="sleep-val">7</div>
        <input type="range" min="3" max="12" step="0.5" value="7" id="f-sleep"
          oninput="updateSlider(this,'sleep-val')" style="--val:57%">
      </div>
      <div class="form-group">
        <label>睡眠の質</label>
        <select id="f-sleep-quality">
          <option value="">選択...</option>
          <option>よく眠れた</option>
          <option>普通</option>
          <option>あまり眠れなかった</option>
          <option>ほとんど眠れなかった</option>
        </select>
      </div>
      <div class="form-group">
        <label>カフェイン（杯数）</label>
        <div class="slider-value" id="caffeine-val">1</div>
        <input type="range" min="0" max="8" value="1" id="f-caffeine"
          oninput="updateSlider(this,'caffeine-val')" style="--val:12.5%">
      </div>
      <div class="form-group">
        <label>水分補給</label>
        <select id="f-water">
          <option value="">選択...</option>
          <option>十分（2L以上）</option>
          <option>普通（1〜2L）</option>
          <option>少なめ（1L未満）</option>
        </select>
      </div>
      <div class="form-group">
        <label>運動</label>
        <select id="f-exercise">
          <option value="">選択...</option>
          <option>しっかり運動した</option>
          <option>軽く動いた</option>
          <option>ほぼ動かなかった</option>
        </select>
      </div>
      <div class="form-group">
        <label>ストレス度</label>
        <div class="slider-value" id="stress-val">3</div>
        <input type="range" min="1" max="10" value="3" id="f-stress"
          oninput="updateSlider(this,'stress-val')" style="--val:22%">
      </div>

      <div class="section-label">食事・環境</div>

      <div class="form-group full">
        <label>該当する項目</label>
        <div class="pill-group">
          <label class="pill"><input type="checkbox" name="triggers" value="飲酒"><label>飲酒</label></label>
          <label class="pill"><input type="checkbox" name="triggers" value="チョコレート"><label>チョコレート</label></label>
          <label class="pill"><input type="checkbox" name="triggers" value="チーズ"><label>チーズ</label></label>
          <label class="pill"><input type="checkbox" name="triggers" value="加工食品"><label>加工食品</label></label>
          <label class="pill"><input type="checkbox" name="triggers" value="食事スキップ"><label>食事スキップ</label></label>
          <label class="pill"><input type="checkbox" name="triggers" value="長時間画面"><label>長時間画面</label></label>
          <label class="pill"><input type="checkbox" name="triggers" value="生理前後"><label>生理前後</label></label>
          <label class="pill"><input type="checkbox" name="triggers" value="旅行・移動"><label>旅行・移動</label></label>
        </div>
      </div>

      <div class="form-group full">
        <label>メモ（自由記述）</label>
        <textarea id="f-note" placeholder="気になったこと、前日との違いなど..."></textarea>
      </div>

      <div class="form-group full" id="weather-auto-row">
        <label>天気データ（自動取得）</label>
        <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:0.6rem 0.85rem;font-size:12px;color:var(--text2)" id="weather-auto-display">
          取得中...
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="btn-submit">記録する →</button>
      </div>
    </form>
  </div>

  <!-- Log Panel -->
  <div class="panel" id="panel-log">
    <div class="log-filters">
      <button class="filter-btn active" onclick="filterLog('all',this)">すべて</button>
      <button class="filter-btn" onclick="filterLog('headache',this)">頭痛あり</button>
      <button class="filter-btn" onclick="filterLog('no-headache',this)">頭痛なし</button>
    </div>
    <div id="log-list"></div>
  </div>

  <!-- Chart Panel -->
  <div class="panel" id="panel-chart">
    <div class="stat-grid" style="margin-bottom:1.25rem">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">記録日数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-headache">0</div>
        <div class="stat-label">頭痛発生日</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-rate">—</div>
        <div class="stat-label">頭痛発生率</div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="chart-card full">
        <div class="chart-title">頭痛カレンダー（直近30日）</div>
        <div class="chart-wrap tall"><canvas id="chart-timeline"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">睡眠時間と頭痛の関係</div>
        <div class="chart-wrap"><canvas id="chart-sleep"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">ストレス度と頭痛の関係</div>
        <div class="chart-wrap"><canvas id="chart-stress"></canvas></div>
      </div>
      <div class="chart-card full">
        <div class="chart-title">気圧と頭痛（記録がある日）</div>
        <div class="chart-wrap"><canvas id="chart-pressure"></canvas></div>
      </div>
    </div>
    <div id="analysis-box" style="margin-top:1.25rem;background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:1.25rem;display:none">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:0.75rem;font-weight:500">パターン分析</div>
      <div id="analysis-text" style="font-size:13px;color:var(--text2);line-height:1.8"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ---- State ----
let records = JSON.parse(localStorage.getItem('headache-records') || '[]');
let currentWeather = null;
let headacheToday = null;
let currentFilter = 'all';

// ---- Init ----
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('f-date').value = today.toISOString().slice(0,10);
  document.getElementById('f-time').value = today.toTimeString().slice(0,5);
  fetchWeather();
  renderLog();
  renderCharts();
});

// ---- Weather ----
function fetchWeather() {
  if (!navigator.geolocation) {
    document.getElementById('weatherWidget').innerHTML = '<div class="weather-loading">位置情報非対応</div>';
    return;
  }
  navigator.geolocation.getCurrentPosition(async pos => {
    const {latitude: lat, longitude: lon} = pos.coords;
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,surface_pressure,relative_humidity_2m,wind_speed_10m&timezone=auto`);
      const d = await res.json();
      const c = d.current;
      currentWeather = {
        temp: Math.round(c.temperature_2m),
        pressure: Math.round(c.surface_pressure),
        humidity: c.relative_humidity_2m,
        wind: Math.round(c.wind_speed_10m),
        code: c.weathercode,
        lat, lon
      };
      const icon = weatherIcon(c.weathercode);
      document.getElementById('weatherWidget').innerHTML = `
        <div class="weather-icon">${icon}</div>
        <div class="weather-info">
          <div class="weather-temp">${currentWeather.temp}°C</div>
          <div class="weather-detail">気圧 ${currentWeather.pressure} hPa ・ 湿度 ${currentWeather.humidity}%</div>
        </div>`;
      document.getElementById('weather-auto-display').innerHTML =
        `🌡 ${currentWeather.temp}°C ／ 気圧 ${currentWeather.pressure} hPa ／ 湿度 ${currentWeather.humidity}% ／ 風速 ${currentWeather.wind} km/h`;
    } catch(e) {
      document.getElementById('weatherWidget').innerHTML = '<div class="weather-loading">天気取得失敗</div>';
    }
  }, () => {
    document.getElementById('weatherWidget').innerHTML = '<div class="weather-loading" style="font-size:11px;color:var(--text3)">位置情報の許可が必要です</div>';
    document.getElementById('weather-auto-display').textContent = '位置情報が許可されていません';
  });
}

function weatherIcon(code) {
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 49) return '🌫️';
  if (code <= 69) return '🌧️';
  if (code <= 79) return '❄️';
  if (code <= 99) return '⛈️';
  return '🌤️';
}

// ---- Headache toggle ----
function setHeadache(val) {
  headacheToday = val;
  document.getElementById('btn-yes').className = val ? 'active-yes' : '';
  document.getElementById('btn-no').className = !val ? 'active-no' : '';
  document.getElementById('headache-sub').textContent = val ? '今日は頭痛がありました' : '今日は頭痛なし';
  document.getElementById('intensity-group').style.display = val ? '' : 'none';
  document.getElementById('type-group').style.display = val ? '' : 'none';
}

// ---- Sliders ----
function updateSlider(el, outId) {
  document.getElementById(outId).textContent = el.value;
  const pct = ((el.value - el.min) / (el.max - el.min) * 100).toFixed(1);
  el.style.setProperty('--val', pct + '%');
}

// ---- Save ----
function saveRecord(e) {
  e.preventDefault();
  const triggers = [...document.querySelectorAll('input[name=triggers]:checked')].map(x => x.value);
  const rec = {
    id: Date.now(),
    date: document.getElementById('f-date').value,
    time: document.getElementById('f-time').value,
    hasHeadache: headacheToday,
    intensity: headacheToday ? +document.getElementById('f-intensity').value : null,
    headacheType: headacheToday ? document.getElementById('f-headache-type').value : null,
    sleep: +document.getElementById('f-sleep').value,
    sleepQuality: document.getElementById('f-sleep-quality').value,
    caffeine: +document.getElementById('f-caffeine').value,
    water: document.getElementById('f-water').value,
    exercise: document.getElementById('f-exercise').value,
    stress: +document.getElementById('f-stress').value,
    triggers,
    note: document.getElementById('f-note').value,
    weather: currentWeather ? {...currentWeather} : null
  };
  records.unshift(rec);
  localStorage.setItem('headache-records', JSON.stringify(records));
  showToast('記録しました ✓');
  resetForm();
  renderLog();
  renderCharts();
}

function resetForm() {
  document.getElementById('f-note').value = '';
  headacheToday = null;
  document.getElementById('btn-yes').className = '';
  document.getElementById('btn-no').className = '';
  document.getElementById('headache-sub').textContent = '未選択';
  document.getElementById('intensity-group').style.display = 'none';
  document.getElementById('type-group').style.display = 'none';
  document.querySelectorAll('input[name=triggers]').forEach(x => x.checked = false);
  const today = new Date();
  document.getElementById('f-date').value = today.toISOString().slice(0,10);
  document.getElementById('f-time').value = today.toTimeString().slice(0,5);
}

// ---- Toast ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ---- Tabs ----
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const tabs = ['record','log','chart'];
  document.querySelectorAll('.tab')[tabs.indexOf(name)].classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if (name === 'chart') renderCharts();
}

// ---- Log ----
function filterLog(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLog();
}

function renderLog() {
  const el = document.getElementById('log-list');
  let data = [...records];
  if (currentFilter === 'headache') data = data.filter(r => r.hasHeadache);
  if (currentFilter === 'no-headache') data = data.filter(r => r.hasHeadache === false);

  if (!data.length) {
    el.innerHTML = '<div class="log-empty">記録がありません</div>';
    return;
  }
  el.innerHTML = data.map(r => `
    <div class="log-item ${r.hasHeadache ? 'has-headache' : ''}">
      <div class="log-date">${r.date}<br>${r.time||''}</div>
      <div class="log-body">
        <div class="log-tags">
          ${r.hasHeadache ? `<span class="log-tag red">頭痛あり (${r.intensity}/10)</span>` : '<span class="log-tag">頭痛なし</span>'}
          ${r.sleep ? `<span class="log-tag accent">睡眠 ${r.sleep}h</span>` : ''}
          ${r.stress ? `<span class="log-tag">ストレス ${r.stress}/10</span>` : ''}
          ${r.caffeine ? `<span class="log-tag">カフェイン ${r.caffeine}杯</span>` : ''}
          ${(r.triggers||[]).map(t => `<span class="log-tag">${t}</span>`).join('')}
        </div>
        ${r.weather ? `<div class="log-meta" style="margin-top:6px">🌡 ${r.weather.temp}°C ／ 気圧 ${r.weather.pressure} hPa ／ 湿度 ${r.weather.humidity}%</div>` : ''}
        ${r.note ? `<div class="log-note">"${r.note}"</div>` : ''}
      </div>
      <button class="log-delete" onclick="deleteRecord(${r.id})" title="削除">×</button>
    </div>
  `).join('');
}

function deleteRecord(id) {
  if (!confirm('この記録を削除しますか？')) return;
  records = records.filter(r => r.id !== id);
  localStorage.setItem('headache-records', JSON.stringify(records));
  renderLog();
  renderCharts();
}

// ---- Charts ----
let charts = {};
function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function renderCharts() {
  const total = records.length;
  const headacheCount = records.filter(r => r.hasHeadache).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-headache').textContent = headacheCount;
  document.getElementById('stat-rate').textContent = total ? Math.round(headacheCount/total*100)+'%' : '—';

  const baseFont = { family: "'Noto Sans JP', sans-serif", size: 11 };
  const gridColor = 'rgba(255,255,255,0.06)';
  const tickColor = '#5a5856';

  // Timeline (last 30 days)
  destroyChart('timeline');
  const last30 = [...Array(30)].map((_,i) => {
    const d = new Date(); d.setDate(d.getDate()-29+i);
    return d.toISOString().slice(0,10);
  });
  const timelineData = last30.map(date => {
    const rec = records.find(r => r.date === date);
    if (!rec) return null;
    return rec.hasHeadache ? (rec.intensity || 5) : 0;
  });
  charts['timeline'] = new Chart(document.getElementById('chart-timeline'), {
    type: 'bar',
    data: {
      labels: last30.map(d => d.slice(5)),
      datasets: [{
        data: timelineData,
        backgroundColor: timelineData.map(v => v === null ? 'transparent' : v > 0 ? `rgba(224,90,90,${Math.min(0.3+v*0.07,1)})` : 'rgba(90,155,224,0.3)'),
        borderColor: timelineData.map(v => v === null ? 'transparent' : v > 0 ? '#e05a5a' : '#5a9be0'),
        borderWidth: 0.5,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ctx.raw === 0 ? '頭痛なし' : ctx.raw === null ? 'データなし' : `頭痛強度: ${ctx.raw}` }
      }},
      scales: {
        x: { ticks: { color: tickColor, font: baseFont, maxRotation: 45 }, grid: { color: gridColor } },
        y: { min: 0, max: 10, ticks: { color: tickColor, font: baseFont }, grid: { color: gridColor } }
      }
    }
  });

  // Sleep correlation
  destroyChart('sleep');
  const sleepData = records.filter(r => r.sleep && r.hasHeadache !== null);
  const sleepGroups = {};
  sleepData.forEach(r => {
    const key = r.sleep <= 5 ? '〜5h' : r.sleep <= 6 ? '6h' : r.sleep <= 7 ? '7h' : r.sleep <= 8 ? '8h' : '9h〜';
    if (!sleepGroups[key]) sleepGroups[key] = {total:0, headache:0};
    sleepGroups[key].total++;
    if (r.hasHeadache) sleepGroups[key].headache++;
  });
  const sleepLabels = ['〜5h','6h','7h','8h','9h〜'];
  const sleepRates = sleepLabels.map(k => sleepGroups[k] ? Math.round(sleepGroups[k].headache/sleepGroups[k].total*100) : null);
  charts['sleep'] = new Chart(document.getElementById('chart-sleep'), {
    type: 'bar',
    data: {
      labels: sleepLabels,
      datasets: [{
        label: '頭痛発生率(%)',
        data: sleepRates,
        backgroundColor: 'rgba(200,169,126,0.25)',
        borderColor: '#c8a97e',
        borderWidth: 0.5,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: tickColor, font: baseFont }, grid: { color: gridColor } },
        y: { min: 0, max: 100, ticks: { color: tickColor, font: baseFont, callback: v => v+'%' }, grid: { color: gridColor } }
      }
    }
  });

  // Stress correlation
  destroyChart('stress');
  const stressGroups = {low:0,lowH:0, mid:0,midH:0, high:0,highH:0};
  records.filter(r => r.stress && r.hasHeadache !== null).forEach(r => {
    if (r.stress <= 3) { stressGroups.low++; if (r.hasHeadache) stressGroups.lowH++; }
    else if (r.stress <= 6) { stressGroups.mid++; if (r.hasHeadache) stressGroups.midH++; }
    else { stressGroups.high++; if (r.hasHeadache) stressGroups.highH++; }
  });
  charts['stress'] = new Chart(document.getElementById('chart-stress'), {
    type: 'bar',
    data: {
      labels: ['低(1-3)','中(4-6)','高(7-10)'],
      datasets: [{
        label: '頭痛発生率(%)',
        data: [
          stressGroups.low ? Math.round(stressGroups.lowH/stressGroups.low*100) : null,
          stressGroups.mid ? Math.round(stressGroups.midH/stressGroups.mid*100) : null,
          stressGroups.high ? Math.round(stressGroups.highH/stressGroups.high*100) : null,
        ],
        backgroundColor: ['rgba(90,184,122,0.25)','rgba(200,169,126,0.25)','rgba(224,90,90,0.25)'],
        borderColor: ['#5ab87a','#c8a97e','#e05a5a'],
        borderWidth: 0.5,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: tickColor, font: baseFont }, grid: { color: gridColor } },
        y: { min: 0, max: 100, ticks: { color: tickColor, font: baseFont, callback: v => v+'%' }, grid: { color: gridColor } }
      }
    }
  });

  // Pressure chart
  destroyChart('pressure');
  const pressureRecs = records.filter(r => r.weather && r.weather.pressure).slice(0,20).reverse();
  if (pressureRecs.length > 1) {
    charts['pressure'] = new Chart(document.getElementById('chart-pressure'), {
      type: 'line',
      data: {
        labels: pressureRecs.map(r => r.date.slice(5)),
        datasets: [
          {
            label: '気圧 (hPa)',
            data: pressureRecs.map(r => r.weather.pressure),
            borderColor: '#5a9be0',
            backgroundColor: 'rgba(90,155,224,0.1)',
            fill: true,
            tension: 0.4,
            yAxisID: 'y',
            pointRadius: pressureRecs.map(r => r.hasHeadache ? 6 : 3),
            pointBackgroundColor: pressureRecs.map(r => r.hasHeadache ? '#e05a5a' : '#5a9be0'),
            pointBorderColor: pressureRecs.map(r => r.hasHeadache ? '#e05a5a' : '#5a9be0'),
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { afterBody: (items) => {
            const rec = pressureRecs[items[0].dataIndex];
            return rec.hasHeadache ? ['🔴 頭痛あり ('+rec.intensity+'/10)'] : ['✓ 頭痛なし'];
          }}
        }},
        scales: {
          x: { ticks: { color: tickColor, font: baseFont }, grid: { color: gridColor } },
          y: { ticks: { color: tickColor, font: baseFont }, grid: { color: gridColor } }
        }
      }
    });
  } else {
    document.getElementById('chart-pressure').parentElement.innerHTML = '<div class="chart-empty">気圧データが2件以上記録されると表示されます</div>';
  }

  // Pattern analysis
  analyzePatterns();
}

function analyzePatterns() {
  const box = document.getElementById('analysis-box');
  const txt = document.getElementById('analysis-text');
  if (records.length < 5) { box.style.display = 'none'; return; }
  box.style.display = '';
  const insights = [];
  const h = records.filter(r => r.hasHeadache);
  const nh = records.filter(r => r.hasHeadache === false);

  if (h.length && nh.length) {
    const avgSleepH = h.reduce((s,r)=>s+(r.sleep||0),0)/h.length;
    const avgSleepNH = nh.reduce((s,r)=>s+(r.sleep||0),0)/nh.length;
    if (Math.abs(avgSleepH - avgSleepNH) > 0.5)
      insights.push(`😴 頭痛があった日の平均睡眠時間は <strong>${avgSleepH.toFixed(1)}h</strong>、なかった日は <strong>${avgSleepNH.toFixed(1)}h</strong> でした。`);

    const avgStressH = h.reduce((s,r)=>s+(r.stress||0),0)/h.length;
    const avgStressNH = nh.reduce((s,r)=>s+(r.stress||0),0)/nh.length;
    if (Math.abs(avgStressH - avgStressNH) > 1)
      insights.push(`😤 頭痛があった日の平均ストレス度は <strong>${avgStressH.toFixed(1)}</strong>、なかった日は <strong>${avgStressNH.toFixed(1)}</strong> でした。`);

    const pressureH = h.filter(r=>r.weather).map(r=>r.weather.pressure);
    const pressureNH = nh.filter(r=>r.weather).map(r=>r.weather.pressure);
    if (pressureH.length && pressureNH.length) {
      const avgPH = pressureH.reduce((a,b)=>a+b,0)/pressureH.length;
      const avgPNH = pressureNH.reduce((a,b)=>a+b,0)/pressureNH.length;
      if (Math.abs(avgPH - avgPNH) > 3)
        insights.push(`🌡 頭痛があった日の平均気圧は <strong>${Math.round(avgPH)} hPa</strong>、なかった日は <strong>${Math.round(avgPNH)} hPa</strong> でした。`);
    }

    const triggerCount = {};
    h.forEach(r => (r.triggers||[]).forEach(t => { triggerCount[t]=(triggerCount[t]||0)+1; }));
    const topTrigger = Object.entries(triggerCount).sort((a,b)=>b[1]-a[1])[0];
    if (topTrigger) insights.push(`⚠️ 頭痛があった日に最も多かった項目は「<strong>${topTrigger[0]}</strong>」（${topTrigger[1]}回）です。`);
  }

  if (!insights.length) insights.push('まだ十分なデータがありません。記録を続けるとパターンが見えてきます。');
  txt.innerHTML = insights.join('<br><br>');
}
